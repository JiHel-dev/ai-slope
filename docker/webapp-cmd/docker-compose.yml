services:
  cmd-kuma-check:
    build: .
    image: cmd-kuma-check:local
    container_name: cmd-kuma-check
    ports:
      - "${PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      AUTH_TOKEN: ${AUTH_TOKEN:?Set AUTH_TOKEN in the environment or a .env file}
      CONFIG_PATH: /app/config.json
      FAIL_HTTP: ${FAIL_HTTP:-0}
    volumes:
      - ./config.json:/app/config.json:ro
    # Uncomment to inspect the host (systemctl, host network, etc.):
    # network_mode: host
    # pid: host
    # volumes:
    #   - ./config.json:/app/config.json:ro
    #   - /run/systemd/system:/run/systemd/system:ro
    #   - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    restart: unless-stopped
